name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  MOONBIT_INSTALL_VERSION: "0.10.16+b1a0e846e"

jobs:
  check:
    name: check / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain versions
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check
        run: moon check --target wasm-gc

      - name: Build
        run: moon build --target wasm-gc

      - name: Test
        run: moon test --target wasm-gc

      - name: Public API baseline
        run: |
          moon info
          python3 scripts/check-api.py

      - name: Check the layout table against clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev
          bash scripts/verify-layout.sh

      - name: Regenerate, compile and run SQLite and zlib bindings
        run: python3 scripts/verify-workflow.py --native

      - name: Strict diagnostics, bridge runtime and sanitizer validation
        run: python3 scripts/verify-v03.py --native

      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonbind-validation
          path: |
            _build/v03-*/validation-results.json
            _build/v03-*/upgrade-review.html
          if-no-files-found: ignore

      - name: Format
        run: moon fmt --check

  native-projects:
    name: 0.5 projects / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Linux C dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev
      - name: Dependencies and versions
        run: |
          moon update
          moon version --all
          clang --version
      - name: Independent projects, contracts, provenance and relocation
        run: python3 scripts/verify-v05.py --native
      - name: Preserve project validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonbind-0.5-${{ matrix.os }}
          path: |
            _build/v05-*/**/reports/validation.json
            _build/v05-*/**/reports/validation.html
            _build/v05-*/**/reports/doctor.json
          if-no-files-found: warn

  native-v08:
    name: 0.8 calls and upgrades / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Resolve dependencies
        run: moon update
      - name: Native contracts, SQLite callbacks, traces and upgrades
        run: python scripts/verify-v08.py
      - name: Preserve 0.8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonbind-0.8-${{ matrix.os }}
          path: |
            _build/v08-*/summary.json
            _build/v08-*/**/reports/*.json
            _build/v08-*/**/reports/*.html
          if-no-files-found: warn

  native-v09:
    name: 0.9 library delivery / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Resolve dependencies
        run: moon update
      - name: Native contracts, SQLite callbacks, traces and upgrades
        run: python scripts/verify-v09.py
      - name: Preserve 0.9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonbind-0.9-${{ matrix.os }}
          path: |
            _build/v09-*/summary.json
            _build/v09-*/**/reports/*.json
            _build/v09-*/**/reports/*.html
          if-no-files-found: warn

  release-v1:
    name: 1.0 acceptance / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Install pinned MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Resolve dependencies and record tools
        run: |
          moon update
          moon version --all
          python --version
      - name: Migration, copied install, upgrades and three-library snapshots
        run: python scripts/verify-v1.py
      - name: Bounded parser corpus
        run: python scripts/verify-parser-corpus.py
      - name: Preserve 1.0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonbind-1.0-${{ matrix.os }}
          path: |
            _build/v1-*/summary.json
            _build/v1-*/native-calls.txt
            _build/v1-*/**/reports/*.json
            _build/parser-corpus-*/summary.json
          if-no-files-found: warn

  latest-compatibility:
    name: Latest compiler compatibility
    runs-on: ubuntu-latest
    env:
      MOONBIT_INSTALL_VERSION: latest
    steps:
      - uses: actions/checkout@v5
      - name: Install current compiler
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Public packages and core tests
        run: |
          moon version --all
          moon update
          moon test --target wasm-gc
