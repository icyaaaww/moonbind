name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    name: check / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain versions
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check
        run: moon check --target wasm-gc

      - name: Build
        run: moon build --target wasm-gc

      - name: Test
        run: moon test --target wasm-gc

      - name: Check the layout table against clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev
          bash scripts/verify-layout.sh

      - name: Regenerate, compile and run SQLite and zlib bindings
        run: python3 scripts/verify-workflow.py --native

      - name: Strict diagnostics, bridge runtime and sanitizer validation
        run: python3 scripts/verify-v03.py --native

      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonbind-validation
          path: |
            _build/v03-*/validation-results.json
            _build/v03-*/upgrade-review.html
          if-no-files-found: ignore

      - name: Format
        run: moon fmt --check

  native-projects:
    name: 0.5 projects / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Linux C dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev
      - name: Dependencies and versions
        run: |
          moon update
          moon version --all
          clang --version
      - name: Independent projects, contracts, provenance and relocation
        run: python3 scripts/verify-v05.py --native
      - name: Preserve project validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonbind-0.5-${{ matrix.os }}
          path: |
            _build/v05-*/**/reports/validation.json
            _build/v05-*/**/reports/validation.html
            _build/v05-*/**/reports/doctor.json
          if-no-files-found: warn
