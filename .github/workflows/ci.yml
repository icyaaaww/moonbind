name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    name: check / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain versions
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check
        run: moon check --target wasm-gc

      - name: Build
        run: moon build --target wasm-gc

      - name: Test
        run: moon test --target wasm-gc

      - name: Check the layout table against clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          bash scripts/verify-layout.sh

      - name: Format
        # The examples are left out: their `moon.pkg` must keep the
        # `"supported-targets"` option, which is the only spelling the
        # compiler accepts, and `moon fmt` would rewrite it into a top-level
        # `supported_targets` key that the same compiler then rejects.
        run: |
          moon fmt --check ast cli cmd codegen cp cparse layout lex source
